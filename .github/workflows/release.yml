name: release

# 推送 v* tag 时编译四个平台并发布 GitHub Release；
# PR / main 分支 / 手动触发时只编译并上传构建产物，不发布。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >>"$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev+${GITHUB_SHA::7}" >>"$GITHUB_OUTPUT"
          fi

      - name: Build
        run: scripts/build-release.sh "${{ steps.version.outputs.version }}" "${{ matrix.goos }}/${{ matrix.goarch }}"

      - name: Smoke test
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP"/cftunnel_*/cftunnel --version

      - uses: actions/upload-artifact@v7
        with:
          name: cftunnel-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 只发布已合并到 main 的提交：tag 必须打在 main 上
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Require tag on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main; merge to main first, then tag main."
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          pattern: cftunnel-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum ./*.tar.gz | sed 's| \./| |' >checksums.txt && cat checksums.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
